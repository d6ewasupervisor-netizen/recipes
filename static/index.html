<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#143036">
  <meta name="description" content="Import, scale, convert, and cook your recipes.">
  <title>Recipes</title>
  <link rel="icon" href="/icon-launcher.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-launcher.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header no-print">
    <a href="#/" class="logo">
      <img src="/icon-launcher.svg" alt="" class="logo-mark" width="36" height="36">
      <span>Recipes</span>
    </a>
    <nav id="main-nav" aria-label="Main"></nav>
  </header>

  <main id="app"></main>

  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <form method="dialog" id="auth-form">
      <div class="dialog-icon" aria-hidden="true"></div>
      <h2 id="auth-title">Sign in</h2>
      <p class="guide-text">Enter your email to access the recipe app.</p>
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" autocomplete="email" required>
      <p id="auth-error" class="error hidden" role="alert"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn primary">Continue</button>
      </div>
    </form>
  </dialog>

  <dialog id="voice-settings-dialog" class="voice-settings-dialog" aria-labelledby="vs-dialog-title">
    <form method="dialog" id="voice-settings-form">
      <h2 id="vs-dialog-title">Voice assistant</h2>
      <p class="guide-text">Saved to your account. HD voices sound best; Standard is faster.</p>
      <div class="voice-settings-form" id="vs-dialog-fields"></div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="vs-dialog-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="vs-dialog-save">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
